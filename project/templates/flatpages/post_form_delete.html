{% extends "flatpages/default.html" %}

{% block content %}
<h1>Удаление</h1>

<p>Вы уверены, что хотите удалить "{{ object.title }}"?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Подтвердить удаление</button>
    <a href="{% url 'news_list' %}">Отмена</a>
</form>
{% endblock %}
